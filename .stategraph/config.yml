hooks:
  all:
    pre:
      - type: run
        cmd:
          - sh
          - -c
          - >-
            curl -fsSL
            https://sg-demo.tailfa28d.ts.net/cli/stategraph-2091-linux-amd64.tar.gz
            -o /tmp/stategraph.tar.gz
            && tar xzf /tmp/stategraph.tar.gz -C /usr/local/bin stategraph
            && chmod +x /usr/local/bin/stategraph
            && rm -f /tmp/stategraph.tar.gz
        run_on: always

dirs:
  infra/app:
    tags: [app, infra]
  infra/db:
    tags: [db, infra]
  infra/network:
    tags: [network, infra]
  infra/cache:
    tags: [cache, infra]
  envs/dev:
    tags: [dev]
  envs/staging:
    tags: [staging]
  envs/prod:
    tags: [prod]
  stacks/base:
    tags: [base]
  stacks/services:
    tags: [services]
  workspaces/multiws:
    workspaces:
      default:
        tags: [defws]
      alt:
        tags: [altws]
tags:
  dest_branch:
    main: "main"
