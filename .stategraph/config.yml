hooks:
  all:
    pre:
      - type: run
        cmd:
          - sh
          - -c
          - >-
            curl -fsSL
            https://sg-demo.tailfa28d.ts.net/cli/stategraph-2091-linux-amd64.tar.gz
            -o /tmp/stategraph.tar.gz
            && tar xzf /tmp/stategraph.tar.gz -C /usr/local/bin stategraph
            && chmod +x /usr/local/bin/stategraph
            && rm -f /tmp/stategraph.tar.gz
        run_on: always

dirs:
  infra/app:
    tags: [app, infra]
  infra/db:
    tags: [db, infra]
  infra/network:
    tags: [network, infra]
  infra/cache:
    tags: [cache, infra]
  envs/dev:
    tags: [dev]
  envs/staging:
    tags: [staging]
  envs/prod:
    tags: [prod]
  stacks/base:
    tags: [base]
  stacks/services:
    tags: [services]
  workspaces/multiws:
    workspaces:
      default:
        tags: [defws]
      alt:
        tags: [altws]
tags:
  dest_branch:
    main: "main"
workflows:
  - tag_query: "dir:envs/dev"
    engine:
      name: tofu
      version: "1.9.1"
  - tag_query: "dir:infra/app"
    plan:
      - type: init
      - type: plan
      - type: run
        cmd: ["${TERRATEAM_ROOT}/scripts/compliance-report.sh"]
        capture_output: true
        visible_on: always
        format: markdown
      - type: run
        cmd: ["${TERRATEAM_ROOT}/scripts/inventory-json.sh"]
        capture_output: true
        visible_on: always
        format:
          type: code
          lang: json
      - type: run
        cmd: ["sh", "-c", "echo notify failed && exit 6"]
        capture_output: true
        ignore_errors: true
        visible_on: failure
      - type: run
        cmd: ["sh", "-c", "echo posted summary to channel"]
        capture_output: true
        visible_on: success
    apply:
      - type: init
      - type: apply
